<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gridiron Dynamics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { pixel: ['"Press Start 2P"', 'monospace'] },
          colors: {
            field: { dark: '#1a5c2a', mid: '#1e6b30', light: '#227735' },
            retro: {
              green: '#00ff41', yellow: '#ffe600', red: '#ff3131',
              blue: '#00aaff', brown: '#8b5e3c', white: '#f0f0e8',
              bg: '#0d0d0d', panel: '#1a1a2e', border: '#2a2a4a'
            }
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background: #0d0d0d; margin: 0; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1a1a2e; }
    ::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 3px; }
    input[type=range] { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 3px; background: #2a2a4a; outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 0; background: #00ff41; cursor: pointer; border: 2px solid #0d0d0d; image-rendering: pixelated; }
    input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 0; background: #00ff41; cursor: pointer; border: 2px solid #0d0d0d; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    const G = 9.8;
    const CANVAS_W = 700;
    const CANVAS_H = 280;
    const GROUND_Y = 40;
    const SCALE = 8.5;
    const QB_X_M = 2;
    const CATCH_MIN_Y = 0.4;
    const CATCH_MAX_Y = 2.8;
    const YARDS_PER_METER = 1.09;

    // --- Pure physics functions ---
    function toRad(deg) { return deg * Math.PI / 180; }

    function ballPos(t, vi, angleDeg) {
      const a = toRad(angleDeg);
      const vx = vi * Math.cos(a);
      const vy0 = vi * Math.sin(a);
      const x = vx * t;
      const y = vy0 * t - 0.5 * G * t * t;
      const vy = vy0 - G * t;
      return { x, y, vx, vy };
    }

    function maxRange(vi, angleDeg) {
      const a = toRad(angleDeg);
      const vy0 = vi * Math.sin(a);
      if (vy0 <= 0) return 0;
      const tFlight = 2 * vy0 / G;
      return vi * Math.cos(a) * tFlight;
    }

    // --- Canvas drawing ---
    function worldToCanvas(x_m, y_m) {
      const cx = (QB_X_M + x_m) * SCALE;
      const cy = CANVAS_H - GROUND_Y - y_m * SCALE;
      return { cx, cy };
    }

    function drawField(ctx, receiverDist, firstDownMeters, endZoneMeters) {
      // Sky gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, CANVAS_H - GROUND_Y);
      skyGrad.addColorStop(0, '#050a1a');
      skyGrad.addColorStop(1, '#0a1a35');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H - GROUND_Y);

      // Field stripes
      const stripeW = SCALE * 5;
      for (let i = 0; i < Math.ceil(CANVAS_W / stripeW); i++) {
        ctx.fillStyle = i % 2 === 0 ? '#1a5c2a' : '#1e6b30';
        ctx.fillRect(i * stripeW, CANVAS_H - GROUND_Y, stripeW, GROUND_Y);
      }

      // End zone (blue tint)
      const { cx: ezCx } = worldToCanvas(endZoneMeters, 0);
      if (ezCx < CANVAS_W) {
        const ezStart = Math.max(0, ezCx);
        ctx.fillStyle = 'rgba(0, 60, 180, 0.28)';
        ctx.fillRect(ezStart, 0, CANVAS_W - ezStart, CANVAS_H - GROUND_Y);
        ctx.fillStyle = 'rgba(30, 100, 220, 0.18)';
        ctx.fillRect(ezStart, CANVAS_H - GROUND_Y, CANVAS_W - ezStart, GROUND_Y);
        // End zone boundary line
        ctx.strokeStyle = 'rgba(80, 140, 255, 0.7)';
        ctx.lineWidth = 2;
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(ezStart, 0);
        ctx.lineTo(ezStart, CANVAS_H);
        ctx.stroke();
        // "EZ" label
        if (CANVAS_W - ezStart > 20) {
          ctx.fillStyle = 'rgba(100, 160, 255, 0.8)';
          ctx.font = '7px "Press Start 2P"';
          ctx.textAlign = 'center';
          ctx.fillText('EZ', ezStart + Math.min(20, (CANVAS_W - ezStart) / 2), 10);
        }
      }

      // Yard lines (every 10 meters)
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 1;
      ctx.setLineDash([]);
      for (let m = 0; m < CANVAS_W / SCALE; m += 10) {
        const x = m * SCALE;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, CANVAS_H);
        ctx.stroke();
      }

      // Hash marks
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 1;
      for (let m = 0; m < CANVAS_W / SCALE; m += 2) {
        const x = m * SCALE;
        ctx.beginPath();
        ctx.moveTo(x, CANVAS_H - GROUND_Y - 3);
        ctx.lineTo(x, CANVAS_H - GROUND_Y + 3);
        ctx.stroke();
      }

      // Ground line
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(0, CANVAS_H - GROUND_Y);
      ctx.lineTo(CANVAS_W, CANVAS_H - GROUND_Y);
      ctx.stroke();

      // Receiver zone highlight
      const rxCanvas = worldToCanvas(receiverDist, 0);
      ctx.fillStyle = 'rgba(255,230,0,0.08)';
      ctx.fillRect(rxCanvas.cx - 15, 0, 30, CANVAS_H - GROUND_Y);

      // First-down line (gold dashed)
      const { cx: fdCx } = worldToCanvas(firstDownMeters, 0);
      if (fdCx > QB_X_M * SCALE && fdCx < CANVAS_W) {
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 4]);
        ctx.beginPath();
        ctx.moveTo(fdCx, 0);
        ctx.lineTo(fdCx, CANVAS_H);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#ffd700';
        ctx.font = '6px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText('1ST', fdCx, 10);
      }
    }

    function drawQB(ctx) {
      const { cx, cy } = worldToCanvas(0, 0);
      ctx.fillStyle = '#3a6bc4';
      ctx.fillRect(cx - 6, cy - 28, 12, 14);
      ctx.fillStyle = '#3a6bc4';
      ctx.fillRect(cx - 5, cy - 40, 10, 12);
      ctx.fillStyle = '#c8a830';
      ctx.fillRect(cx - 5, cy - 33, 10, 4);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(cx - 6, cy - 14, 5, 14);
      ctx.fillRect(cx + 1, cy - 14, 5, 14);
      ctx.fillStyle = '#c8a830';
      ctx.fillRect(cx + 4, cy - 30, 8, 4);
      ctx.fillStyle = '#ffe600';
      ctx.font = '7px "Press Start 2P"';
      ctx.textAlign = 'center';
      ctx.fillText('QB', cx, cy - 44);
    }

    function drawReceiver(ctx, receiverDist, isCaught) {
      const { cx, cy } = worldToCanvas(receiverDist, 0);
      ctx.fillStyle = isCaught ? '#00ff41' : '#ff6600';
      ctx.fillRect(cx - 5, cy - 28, 10, 14);
      ctx.fillRect(cx - 5, cy - 40, 10, 12);
      ctx.fillStyle = isCaught ? '#003311' : '#331100';
      ctx.fillRect(cx - 5, cy - 33, 10, 4);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(cx - 5, cy - 14, 4, 14);
      ctx.fillRect(cx + 1, cy - 14, 4, 14);
      const minY = worldToCanvas(receiverDist, CATCH_MIN_Y).cy;
      const maxY = worldToCanvas(receiverDist, CATCH_MAX_Y).cy;
      ctx.strokeStyle = isCaught ? '#00ff41' : 'rgba(255,200,0,0.5)';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.strokeRect(cx - 12, maxY, 24, minY - maxY);
      ctx.setLineDash([]);
      ctx.fillStyle = isCaught ? '#00ff41' : '#ffe600';
      ctx.font = '7px "Press Start 2P"';
      ctx.textAlign = 'center';
      ctx.fillText('WR', cx, cy - 44);
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.font = '6px "Press Start 2P"';
      ctx.fillText(receiverDist + 'm', cx, CANVAS_H - GROUND_Y + 14);
    }

    function drawBall(ctx, trail, ballX_m, ballY_m) {
      for (let i = 0; i < trail.length; i++) {
        const alpha = (i / trail.length) * 0.5;
        const r = 2 + (i / trail.length) * 2;
        ctx.beginPath();
        ctx.arc(trail[i].cx, trail[i].cy, r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 180, 50, ${alpha})`;
        ctx.fill();
      }
      const { cx, cy } = worldToCanvas(ballX_m, ballY_m);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.fillStyle = '#8B4513';
      ctx.beginPath();
      ctx.ellipse(0, 0, 7, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-3, 0); ctx.lineTo(3, 0);
      ctx.stroke();
      ctx.restore();
    }

    function drawResult(ctx, result) {
      ctx.fillStyle = result === 'COMPLETE' ? 'rgba(0,255,65,0.15)' : 'rgba(255,49,49,0.15)';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.fillStyle = result === 'COMPLETE' ? '#00ff41' : '#ff3131';
      ctx.font = '20px "Press Start 2P"';
      ctx.textAlign = 'center';
      ctx.fillText(result === 'COMPLETE' ? 'COMPLETE!' : 'INCOMPLETE', CANVAS_W / 2, CANVAS_H / 2 - 10);
    }

    // --- Helpers ---
    function formatFieldPos(yards) {
      if (yards >= 100) return 'END ZONE';
      if (Math.round(yards) === 50) return 'MID 50';
      if (yards < 50) return `OWN ${Math.round(yards)}`;
      return `OPP ${Math.round(100 - yards)}`;
    }

    function downLabel(d) {
      return ['1ST', '2ND', '3RD', '4TH'][d - 1] || '4TH';
    }

    // --- Components ---
    function Header() {
      return (
        <div className="relative text-center py-4">
          <a
            href="index.html"
            className="absolute left-0 font-pixel text-xs px-3 py-2 rounded"
            style={{
              top: '50%', transform: 'translateY(-50%)',
              color: '#4a8c5c', border: '1px solid #2a2a4a',
              background: '#0a0a1a', textDecoration: 'none'
            }}
          >
            ← MENU
          </a>
          <h1 className="font-pixel text-retro-green text-lg tracking-widest" style={{textShadow: '0 0 20px #00ff41, 2px 2px 0 #003311'}}>
            GRIDIRON DYNAMICS
          </h1>
          <p className="font-pixel text-xs mt-2" style={{color:'#4a8c5c'}}>PHYSICS-POWERED PASSING</p>
        </div>
      );
    }

    function GameStatus({ down, yardsToGo, fieldPosition, driveStatus, onNewDrive }) {
      const isRedZone = fieldPosition >= 80 && driveStatus === 'active';
      const is4thDown = down === 4 && driveStatus === 'active';

      if (driveStatus !== 'active') {
        return (
          <div className="flex items-center justify-between p-3 rounded" style={{
            background: '#0a0a1a',
            border: `2px solid ${driveStatus === 'touchdown' ? '#ffe600' : '#ff3131'}`
          }}>
            <span className="font-pixel text-xs" style={{color: driveStatus === 'touchdown' ? '#ffe600' : '#ff3131'}}>
              {driveStatus === 'touchdown' ? 'TOUCHDOWN!' : 'TURNOVER ON DOWNS'}
            </span>
            <button
              onClick={onNewDrive}
              className="font-pixel text-xs px-3 py-2 rounded"
              style={{
                background: '#0d1a0d', color: '#00ff41',
                border: '2px solid #00ff41', cursor: 'pointer',
                textShadow: '0 0 8px #00ff41'
              }}
            >
              [ NEW DRIVE ]
            </button>
          </div>
        );
      }

      return (
        <div className="grid grid-cols-3 gap-2">
          <div className="p-3 rounded text-center" style={{
            background: '#0a0a1a',
            border: `2px solid ${is4thDown ? '#ff3131' : '#2a2a4a'}`
          }}>
            <div className="font-pixel text-xs mb-1" style={{color: '#4a4a7a'}}>DOWN</div>
            <div className="font-pixel text-lg" style={{
              color: is4thDown ? '#ff3131' : '#ffe600',
              textShadow: is4thDown ? '0 0 12px #ff3131' : 'none'
            }}>
              {downLabel(down)}
            </div>
          </div>
          <div className="p-3 rounded text-center" style={{background: '#0a0a1a', border: '2px solid #2a2a4a'}}>
            <div className="font-pixel text-xs mb-1" style={{color: '#4a4a7a'}}>TO GO</div>
            <div className="font-pixel" style={{color: '#00aaff', fontSize: '14px'}}>
              {yardsToGo.toFixed(1)} <span style={{fontSize: '7px'}}>YDS</span>
            </div>
          </div>
          <div className="p-3 rounded text-center" style={{
            background: '#0a0a1a',
            border: `2px solid ${isRedZone ? '#ff3131' : '#2a2a4a'}`
          }}>
            <div className="font-pixel text-xs mb-1" style={{color: isRedZone ? '#ff3131' : '#4a4a7a'}}>
              {isRedZone ? 'RED ZONE' : 'FIELD POS'}
            </div>
            <div className="font-pixel text-sm" style={{
              color: isRedZone ? '#ff3131' : '#00ff41',
              textShadow: isRedZone ? '0 0 10px #ff3131' : 'none'
            }}>
              {formatFieldPos(fieldPosition)}
            </div>
          </div>
        </div>
      );
    }

    function VelocityOverlay({ vx, vy, isAnimating }) {
      if (!isAnimating) return null;
      return (
        <div className="absolute top-2 right-2 font-pixel text-xs space-y-1 pointer-events-none" style={{zIndex:10}}>
          <div className="px-2 py-1 rounded" style={{background:'rgba(0,0,0,0.7)', border:'1px solid #00aaff', color:'#00aaff'}}>
            Vx = {vx.toFixed(1)} m/s →
          </div>
          <div className="px-2 py-1 rounded" style={{background:'rgba(0,0,0,0.7)', border:'1px solid #ff6600', color: vy >= 0 ? '#00ff41' : '#ff3131'}}>
            Vy = {vy.toFixed(1)} m/s {vy >= 0 ? '↑' : '↓'}
          </div>
        </div>
      );
    }

    function ControlPanel({ vi, setVi, angle, setAngle, onSimulate, onRandomize, isAnimating, disabled }) {
      return (
        <div className="grid grid-cols-2 gap-4 p-4 rounded-lg" style={{background:'#1a1a2e', border:'2px solid #2a2a4a'}}>
          <div>
            <label className="font-pixel text-xs mb-2 block" style={{color:'#00aaff'}}>VELOCITY (v_i)</label>
            <div className="flex items-center gap-2">
              <input type="range" min="1" max="50" value={vi}
                onChange={e => setVi(Number(e.target.value))}
                className="flex-1" disabled={isAnimating || disabled} />
              <span className="font-pixel text-xs w-16 text-right" style={{color:'#00ff41'}}>{vi} m/s</span>
            </div>
          </div>
          <div>
            <label className="font-pixel text-xs mb-2 block" style={{color:'#ff6600'}}>ANGLE (θ)</label>
            <div className="flex items-center gap-2">
              <input type="range" min="1" max="89" value={angle}
                onChange={e => setAngle(Number(e.target.value))}
                className="flex-1" disabled={isAnimating || disabled} />
              <span className="font-pixel text-xs w-16 text-right" style={{color:'#00ff41'}}>{angle}°</span>
            </div>
          </div>
          <button
            onClick={onSimulate}
            disabled={isAnimating || disabled}
            className="font-pixel text-xs py-3 px-4 rounded transition-all"
            style={{
              background: (isAnimating || disabled) ? '#1a1a2e' : '#003311',
              color: (isAnimating || disabled) ? '#2a4a2a' : '#00ff41',
              border: `2px solid ${(isAnimating || disabled) ? '#1a3a1a' : '#00ff41'}`,
              cursor: (isAnimating || disabled) ? 'not-allowed' : 'pointer',
              textShadow: (isAnimating || disabled) ? 'none' : '0 0 8px #00ff41'
            }}
          >
            {isAnimating ? '[ SIMULATING... ]' : '[ SIMULATE ]'}
          </button>
          <button
            onClick={onRandomize}
            disabled={isAnimating || disabled}
            className="font-pixel text-xs py-3 px-4 rounded transition-all"
            style={{
              background: '#130d2e',
              color: (isAnimating || disabled) ? '#2a2a4a' : '#ffe600',
              border: `2px solid ${(isAnimating || disabled) ? '#2a2a4a' : '#ffe600'}`,
              cursor: (isAnimating || disabled) ? 'not-allowed' : 'pointer',
              textShadow: (isAnimating || disabled) ? 'none' : '0 0 8px #ffe600'
            }}
          >
            [ RANDOMIZE ]
          </button>
        </div>
      );
    }

    function Scoreboard({ completions }) {
      return (
        <div className="flex items-center justify-center gap-6 p-3 rounded" style={{background:'#0a0a1a', border:'2px solid #2a2a4a'}}>
          <span className="font-pixel text-xs" style={{color:'#4a4a7a'}}>COMPLETIONS</span>
          <span className="font-pixel text-2xl" style={{color:'#00ff41', textShadow:'0 0 20px #00ff41'}}>
            {String(completions).padStart(3, '0')}
          </span>
        </div>
      );
    }

    function DataTable({ log }) {
      return (
        <div className="rounded-lg overflow-hidden" style={{border:'2px solid #2a2a4a'}}>
          <div className="px-3 py-2" style={{background:'#0a0a1a'}}>
            <span className="font-pixel text-xs" style={{color:'#4a4a7a'}}>PLAY LOG (LAST 5)</span>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-xs font-pixel" style={{borderCollapse:'collapse'}}>
              <thead>
                <tr style={{background:'#151530'}}>
                  {['DOWN', 'v_i (m/s)', 'θ (°)', 'DIST (m)', 'YDS GAINED', 'RESULT'].map(h => (
                    <th key={h} className="px-3 py-2 text-left" style={{color:'#4a4a7a', borderBottom:'1px solid #2a2a4a', fontSize:'9px'}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {log.length === 0 ? (
                  <tr>
                    <td colSpan={6} className="px-3 py-4 text-center" style={{color:'#2a2a4a', fontSize:'9px'}}>
                      NO PLAYS YET
                    </td>
                  </tr>
                ) : log.map(row => (
                  <tr key={row.id} style={{borderBottom:'1px solid #1a1a2e'}}>
                    <td className="px-3 py-2" style={{color: row.down === 4 ? '#ff3131' : '#ffe600'}}>{downLabel(row.down)}</td>
                    <td className="px-3 py-2" style={{color:'#00aaff'}}>{row.vi}</td>
                    <td className="px-3 py-2" style={{color:'#ff6600'}}>{row.angle}</td>
                    <td className="px-3 py-2" style={{color:'#f0f0e8'}}>{row.dist}</td>
                    <td className="px-3 py-2" style={{color: row.yardsGained > 0 ? '#00ff41' : '#888'}}>
                      {row.yardsGained > 0 ? '+' + row.yardsGained.toFixed(1) : '—'}
                    </td>
                    <td className="px-3 py-2 font-bold" style={{color: row.result === 'COMPLETE' ? '#00ff41' : '#ff3131'}}>
                      {row.result}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function App() {
      const [vi, setVi] = useState(25);
      const [angle, setAngle] = useState(45);
      const [receiverDist, setReceiverDist] = useState(30);
      const [completions, setCompletions] = useState(0);
      const [attemptLog, setAttemptLog] = useState([]);
      const [isAnimating, setIsAnimating] = useState(false);
      const [currentVx, setCurrentVx] = useState(0);
      const [currentVy, setCurrentVy] = useState(0);
      const [showResult, setShowResult] = useState(null);

      // Football game state
      const [down, setDown] = useState(1);
      const [yardsToGo, setYardsToGo] = useState(10);
      const [fieldPosition, setFieldPosition] = useState(20);
      const [driveStatus, setDriveStatus] = useState('active'); // 'active' | 'touchdown' | 'turnover'

      const canvasRef = useRef(null);
      const animRef = useRef(null);
      const trailRef = useRef([]);

      const redrawStatic = useCallback((caught = false) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
        drawField(ctx, receiverDist, yardsToGo / YARDS_PER_METER, (100 - fieldPosition) / YARDS_PER_METER);
        drawQB(ctx);
        drawReceiver(ctx, receiverDist, caught);
      }, [receiverDist, yardsToGo, fieldPosition]);

      useEffect(() => { redrawStatic(); }, [redrawStatic]);

      useEffect(() => {
        if (!isAnimating) { redrawStatic(); setShowResult(null); }
      }, [receiverDist, isAnimating, redrawStatic]);

      const handleNewDrive = () => {
        setDown(1);
        setYardsToGo(10);
        setFieldPosition(20);
        setDriveStatus('active');
        setShowResult(null);
        setReceiverDist(30);
      };

      const handleRandomize = () => {
        if (isAnimating || driveStatus !== 'active') return;
        setShowResult(null);
        const newDist = Math.floor(Math.random() * 45) + 10;
        setReceiverDist(newDist);
      };

      const logAttempt = (viVal, angleVal, distVal, rangeVal, result, currentDown, yardsGained) => {
        setAttemptLog(prev => {
          const entry = { id: Date.now(), vi: viVal, angle: angleVal, dist: distVal, range: rangeVal, result, down: currentDown, yardsGained };
          return [entry, ...prev].slice(0, 5);
        });
      };

      const handleSimulate = () => {
        if (isAnimating || driveStatus !== 'active') return;
        if (animRef.current) cancelAnimationFrame(animRef.current);
        trailRef.current = [];
        setShowResult(null);
        setIsAnimating(true);

        const viVal = vi;
        const angleVal = angle;
        const distVal = receiverDist;
        const range = maxRange(viVal, angleVal);

        // Capture game state at start of play
        const capturedDown = down;
        const capturedYTG = yardsToGo;
        const capturedFieldPos = fieldPosition;
        const fdM = capturedYTG / YARDS_PER_METER;
        const ezM = (100 - capturedFieldPos) / YARDS_PER_METER;

        let startTime = null;

        const animate = (timestamp) => {
          if (!startTime) startTime = timestamp;
          const elapsed = (timestamp - startTime) / 1000;

          const { x, y, vx, vy } = ballPos(elapsed, viVal, angleVal);
          const { cx, cy } = worldToCanvas(x, y);

          setCurrentVx(vx);
          setCurrentVy(vy);

          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');

          trailRef.current.push({ cx, cy });
          if (trailRef.current.length > 20) trailRef.current.shift();

          ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
          drawField(ctx, distVal, fdM, ezM);
          drawQB(ctx);
          drawReceiver(ctx, distVal, false);
          drawBall(ctx, trailRef.current, x, y);

          const caught = Math.abs(x - distVal) < 1.2 && y >= CATCH_MIN_Y && y <= CATCH_MAX_Y;

          if (caught) {
            const yardsGained = Math.round(distVal * YARDS_PER_METER * 10) / 10;
            const newFieldPos = Math.round((capturedFieldPos + yardsGained) * 10) / 10;
            const newYTG = Math.round((capturedYTG - yardsGained) * 10) / 10;

            ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
            drawField(ctx, distVal, fdM, ezM);
            drawQB(ctx);
            drawReceiver(ctx, distVal, true);
            drawBall(ctx, trailRef.current, x, y);
            drawResult(ctx, 'COMPLETE');
            setShowResult('COMPLETE');
            setCompletions(c => c + 1);
            logAttempt(viVal, angleVal, distVal, range, 'COMPLETE', capturedDown, yardsGained);

            if (newFieldPos >= 100) {
              setFieldPosition(100);
              setDriveStatus('touchdown');
            } else if (newYTG <= 0) {
              setFieldPosition(newFieldPos);
              setDown(1);
              setYardsToGo(10);
            } else {
              setFieldPosition(newFieldPos);
              setDown(capturedDown + 1);
              setYardsToGo(newYTG);
            }

            setIsAnimating(false);
            return;
          }

          const missedLong = x > distVal + 1.5;
          const hitGround = y < 0 && x > 0.5;

          if (missedLong || hitGround) {
            ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
            drawField(ctx, distVal, fdM, ezM);
            drawQB(ctx);
            drawReceiver(ctx, distVal, false);
            drawBall(ctx, trailRef.current, x, Math.max(y, 0));
            drawResult(ctx, 'INCOMPLETE');
            setShowResult('INCOMPLETE');
            logAttempt(viVal, angleVal, distVal, range, 'INCOMPLETE', capturedDown, 0);

            const newDown = capturedDown + 1;
            if (newDown > 4) {
              setDriveStatus('turnover');
            } else {
              setDown(newDown);
            }

            setIsAnimating(false);
            return;
          }

          animRef.current = requestAnimationFrame(animate);
        };

        animRef.current = requestAnimationFrame(animate);
      };

      const driveDisabled = driveStatus !== 'active';

      return (
        <div className="min-h-screen py-4 px-2" style={{background:'#0d0d0d', fontFamily:'"Press Start 2P", monospace'}}>
          <div className="max-w-3xl mx-auto space-y-4">
            <Header />

            {/* Canvas area */}
            <div className="relative rounded-lg overflow-hidden" style={{border:'3px solid #2a2a4a'}}>
              <canvas ref={canvasRef} width={CANVAS_W} height={CANVAS_H} className="w-full block" />
              <VelocityOverlay vx={currentVx} vy={currentVy} isAnimating={isAnimating} />
              <div className="absolute bottom-2 left-2 font-pixel pointer-events-none" style={{fontSize:'7px', color:'rgba(255,255,255,0.25)'}}>
                y = x·tan(θ) - gx²/2v²cos²(θ) &nbsp;|&nbsp; g = 9.8 m/s²
              </div>
            </div>

            <GameStatus
              down={down} yardsToGo={yardsToGo}
              fieldPosition={fieldPosition} driveStatus={driveStatus}
              onNewDrive={handleNewDrive}
            />

            <Scoreboard completions={completions} />

            <ControlPanel
              vi={vi} setVi={setVi}
              angle={angle} setAngle={setAngle}
              onSimulate={handleSimulate}
              onRandomize={handleRandomize}
              isAnimating={isAnimating}
              disabled={driveDisabled}
            />

            {/* Current physics preview */}
            <div className="grid grid-cols-3 gap-2 font-pixel text-center" style={{fontSize:'9px'}}>
              <div className="p-2 rounded" style={{background:'#0a0a1a', border:'1px solid #2a2a4a'}}>
                <div style={{color:'#4a4a7a'}}>Vx</div>
                <div style={{color:'#00aaff'}} className="mt-1">{(vi * Math.cos(toRad(angle))).toFixed(1)} m/s</div>
              </div>
              <div className="p-2 rounded" style={{background:'#0a0a1a', border:'1px solid #2a2a4a'}}>
                <div style={{color:'#4a4a7a'}}>Vy₀</div>
                <div style={{color:'#ff6600'}} className="mt-1">{(vi * Math.sin(toRad(angle))).toFixed(1)} m/s</div>
              </div>
              <div className="p-2 rounded" style={{background:'#0a0a1a', border:'1px solid #2a2a4a'}}>
                <div style={{color:'#4a4a7a'}}>MAX RANGE</div>
                <div style={{color:'#ffe600'}} className="mt-1">{maxRange(vi, angle).toFixed(1)} m</div>
              </div>
            </div>

            <DataTable log={attemptLog} />

            <div className="font-pixel text-center pb-4" style={{fontSize:'8px', color:'#2a2a4a'}}>
              HIT WR ± 1.2m &nbsp;|&nbsp; CATCH ZONE: {CATCH_MIN_Y}m – {CATCH_MAX_Y}m HIGH &nbsp;|&nbsp; 1m ≈ 1.09 yds
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
