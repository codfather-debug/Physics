<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gridiron Dynamics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { pixel: ['"Press Start 2P"', 'monospace'] },
          colors: {
            retro: {
              green: '#00ff41', yellow: '#ffe600', red: '#ff3131',
              blue: '#00aaff', bg: '#0d0d0d', panel: '#1a1a2e', border: '#2a2a4a'
            }
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background: #0d0d0d; margin: 0; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1a1a2e; }
    ::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 3px; }
    input[type=range] { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 3px; background: #2a2a4a; outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 0; background: #00ff41; cursor: pointer; border: 2px solid #0d0d0d; }
    input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 0; background: #00ff41; cursor: pointer; border: 2px solid #0d0d0d; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    const G = 9.8;
    const CANVAS_W = 700;
    const CANVAS_H = 280;
    const GROUND_Y = 40;
    const SCALE = 8.5;         // pixels per meter
    const QB_X_M = 2;
    const CATCH_MIN_Y = 0.4;
    const CATCH_MAX_Y = 2.8;
    const M_PER_YARD = 0.9144;

    function toRad(deg) { return deg * Math.PI / 180; }

    function ballPos(t, vi, angleDeg) {
      const a = toRad(angleDeg);
      const vx = vi * Math.cos(a);
      const vy0 = vi * Math.sin(a);
      return { x: vx * t, y: vy0 * t - 0.5 * G * t * t, vx, vy: vy0 - G * t };
    }

    function maxRange(vi, angleDeg) {
      const a = toRad(angleDeg);
      const vy0 = vi * Math.sin(a);
      if (vy0 <= 0) return 0;
      return vi * Math.cos(a) * (2 * vy0 / G);
    }

    function worldToCanvas(x_m, y_m) {
      return { cx: (QB_X_M + x_m) * SCALE, cy: CANVAS_H - GROUND_Y - y_m * SCALE };
    }

    // Convert yards to meters for physics
    function yardsToMeters(y) { return y * M_PER_YARD; }
    // Convert meters (receiver dist) to yards gained
    function metersToYards(m) { return Math.round(m / M_PER_YARD); }

    // fieldPosition: current yard line (0–100). ≤50 = "own", >50 = "opp"
    function posLabel(fp) {
      if (fp <= 0)  return 'OWN 0';
      if (fp >= 100) return 'END ZONE';
      if (fp === 50) return 'MIDFIELD';
      return fp < 50 ? `OWN ${fp}` : `OPP ${100 - fp}`;
    }

    function downLabel(d) { return ['', '1ST', '2ND', '3RD', '4TH'][d] || '4TH'; }

    // ── Canvas drawing ──────────────────────────────────────────────────────────

    function drawField(ctx, receiverDist, firstDownMeters, endZoneMeters) {
      // Sky
      const sky = ctx.createLinearGradient(0, 0, 0, CANVAS_H - GROUND_Y);
      sky.addColorStop(0, '#050a1a'); sky.addColorStop(1, '#0a1a35');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H - GROUND_Y);

      // End zone fill (if visible)
      const ezCx = worldToCanvas(endZoneMeters, 0).cx;
      if (ezCx < CANVAS_W) {
        const ezGrad = ctx.createLinearGradient(ezCx, 0, CANVAS_W, 0);
        ezGrad.addColorStop(0, 'rgba(30,60,180,0.35)');
        ezGrad.addColorStop(1, 'rgba(30,60,180,0.15)');
        ctx.fillStyle = ezGrad;
        ctx.fillRect(Math.max(0, ezCx), 0, CANVAS_W - Math.max(0, ezCx), CANVAS_H - GROUND_Y);
      }

      // Field ground stripes
      const sw = SCALE * 5;
      for (let i = 0; i < Math.ceil(CANVAS_W / sw); i++) {
        ctx.fillStyle = i % 2 === 0 ? '#1a5c2a' : '#1e6b30';
        ctx.fillRect(i * sw, CANVAS_H - GROUND_Y, sw, GROUND_Y);
      }

      // Yard lines every 10m
      ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1;
      for (let m = 0; m < CANVAS_W / SCALE; m += 10) {
        const x = m * SCALE;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CANVAS_H); ctx.stroke();
      }

      // Hash marks every 2m
      ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1;
      for (let m = 0; m < CANVAS_W / SCALE; m += 2) {
        const x = m * SCALE;
        ctx.beginPath(); ctx.moveTo(x, CANVAS_H - GROUND_Y - 3); ctx.lineTo(x, CANVAS_H - GROUND_Y + 3); ctx.stroke();
      }

      // Ground line
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, CANVAS_H - GROUND_Y); ctx.lineTo(CANVAS_W, CANVAS_H - GROUND_Y); ctx.stroke();

      // Receiver zone highlight
      const rxCx = worldToCanvas(receiverDist, 0).cx;
      ctx.fillStyle = 'rgba(255,230,0,0.07)';
      ctx.fillRect(rxCx - 15, 0, 30, CANVAS_H - GROUND_Y);

      // First-down marker (gold chain-link line)
      const fdCx = worldToCanvas(firstDownMeters, 0).cx;
      if (fdCx > 0 && fdCx < CANVAS_W) {
        ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3; ctx.setLineDash([6, 3]);
        ctx.beginPath(); ctx.moveTo(fdCx, 0); ctx.lineTo(fdCx, CANVAS_H); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#fbbf24';
        ctx.font = '6px "Press Start 2P"'; ctx.textAlign = 'center';
        ctx.fillText('1ST', fdCx, 10);
      }

      // End zone line
      if (ezCx > 0 && ezCx < CANVAS_W) {
        ctx.strokeStyle = '#6088ff'; ctx.lineWidth = 3; ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(ezCx, 0); ctx.lineTo(ezCx, CANVAS_H - GROUND_Y); ctx.stroke();
        ctx.fillStyle = '#6088ff';
        ctx.font = '7px "Press Start 2P"'; ctx.textAlign = 'center';
        ctx.fillText('END', (ezCx + Math.min(CANVAS_W, ezCx + 60)) / 2, CANVAS_H / 2 - 6);
        ctx.fillText('ZONE', (ezCx + Math.min(CANVAS_W, ezCx + 60)) / 2, CANVAS_H / 2 + 8);
      }
    }

    function drawQB(ctx) {
      const { cx, cy } = worldToCanvas(0, 0);
      ctx.fillStyle = '#3a6bc4'; ctx.fillRect(cx - 6, cy - 28, 12, 14);
      ctx.fillStyle = '#3a6bc4'; ctx.fillRect(cx - 5, cy - 40, 10, 12);
      ctx.fillStyle = '#c8a830'; ctx.fillRect(cx - 5, cy - 33, 10, 4);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(cx - 6, cy - 14, 5, 14); ctx.fillRect(cx + 1, cy - 14, 5, 14);
      ctx.fillStyle = '#c8a830'; ctx.fillRect(cx + 4, cy - 30, 8, 4);
      ctx.fillStyle = '#ffe600'; ctx.font = '7px "Press Start 2P"'; ctx.textAlign = 'center';
      ctx.fillText('QB', cx, cy - 44);
    }

    function drawReceiver(ctx, receiverDist, state) {
      // state: 'idle' | 'caught' | 'missed'
      const { cx, cy } = worldToCanvas(receiverDist, 0);
      const color = state === 'caught' ? '#00ff41' : '#ff6600';
      ctx.fillStyle = color;
      ctx.fillRect(cx - 5, cy - 28, 10, 14);
      ctx.fillRect(cx - 5, cy - 40, 10, 12);
      ctx.fillStyle = state === 'caught' ? '#003311' : '#331100';
      ctx.fillRect(cx - 5, cy - 33, 10, 4);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(cx - 5, cy - 14, 4, 14); ctx.fillRect(cx + 1, cy - 14, 4, 14);
      const minY = worldToCanvas(receiverDist, CATCH_MIN_Y).cy;
      const maxY = worldToCanvas(receiverDist, CATCH_MAX_Y).cy;
      ctx.strokeStyle = state === 'caught' ? '#00ff41' : 'rgba(255,200,0,0.45)';
      ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
      ctx.strokeRect(cx - 12, maxY, 24, minY - maxY); ctx.setLineDash([]);
      ctx.fillStyle = state === 'caught' ? '#00ff41' : '#ffe600';
      ctx.font = '7px "Press Start 2P"'; ctx.textAlign = 'center';
      ctx.fillText('WR', cx, cy - 44);
      ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '6px "Press Start 2P"';
      ctx.fillText(receiverDist + 'm', cx, CANVAS_H - GROUND_Y + 14);
    }

    function drawBall(ctx, trail, bx, by) {
      for (let i = 0; i < trail.length; i++) {
        ctx.beginPath();
        ctx.arc(trail[i].cx, trail[i].cy, 2 + (i / trail.length) * 2, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,180,50,${(i / trail.length) * 0.5})`;
        ctx.fill();
      }
      const { cx, cy } = worldToCanvas(bx, by);
      ctx.save(); ctx.translate(cx, cy);
      ctx.fillStyle = '#8B4513';
      ctx.beginPath(); ctx.ellipse(0, 0, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(3, 0); ctx.stroke();
      ctx.restore();
    }

    function drawBigText(ctx, line1, line2, color, bgColor) {
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.fillStyle = color;
      ctx.font = '18px "Press Start 2P"'; ctx.textAlign = 'center';
      ctx.fillText(line1, CANVAS_W / 2, CANVAS_H / 2 - 14);
      if (line2) {
        ctx.font = '11px "Press Start 2P"';
        ctx.fillText(line2, CANVAS_W / 2, CANVAS_H / 2 + 12);
      }
    }

    // ── React components ────────────────────────────────────────────────────────

    function BackButton() {
      return (
        <a href="/index.html" className="font-pixel text-xs px-3 py-2 rounded inline-block"
           style={{color:'#4a4a7a', border:'1px solid #2a2a4a', textDecoration:'none', lineHeight:1}}>
          ← MENU
        </a>
      );
    }

    function DownsHUD({ down, yardsToGo, fieldPos, touchdowns }) {
      const is4th = down === 4;
      const isRedZone = fieldPos >= 80;
      return (
        <div className="grid grid-cols-4 gap-2 font-pixel text-center" style={{fontSize:'9px'}}>
          <div className="p-2 rounded" style={{background:'#0a0a1a', border:`2px solid ${is4th ? '#ff3131' : '#2a2a4a'}`}}>
            <div style={{color:'#4a4a7a'}}>DOWN</div>
            <div className="mt-1 text-base" style={{color: is4th ? '#ff3131' : '#00ff41', textShadow: is4th ? '0 0 10px #ff3131' : 'none'}}>
              {downLabel(down)}
            </div>
          </div>
          <div className="p-2 rounded" style={{background:'#0a0a1a', border:'2px solid #2a2a4a'}}>
            <div style={{color:'#4a4a7a'}}>TO GO</div>
            <div className="mt-1 text-base" style={{color:'#ffe600'}}>{yardsToGo} YD</div>
          </div>
          <div className="p-2 rounded" style={{background:'#0a0a1a', border:`2px solid ${isRedZone ? '#ff3131' : '#2a2a4a'}`}}>
            <div style={{color:'#4a4a7a'}}>FIELD POS</div>
            <div className="mt-1" style={{color: isRedZone ? '#ff8844' : '#f0f0e8', fontSize:'8px'}}>{posLabel(fieldPos)}</div>
          </div>
          <div className="p-2 rounded" style={{background:'#0a0a1a', border:'2px solid #2a2a4a'}}>
            <div style={{color:'#4a4a7a'}}>TDs</div>
            <div className="mt-1 text-base" style={{color:'#00aaff', textShadow:'0 0 10px #00aaff'}}>{touchdowns}</div>
          </div>
        </div>
      );
    }

    function VelocityOverlay({ vx, vy, show }) {
      if (!show) return null;
      return (
        <div className="absolute top-2 right-2 font-pixel text-xs space-y-1 pointer-events-none" style={{zIndex:10}}>
          <div className="px-2 py-1 rounded" style={{background:'rgba(0,0,0,0.7)', border:'1px solid #00aaff', color:'#00aaff'}}>
            Vx = {vx.toFixed(1)} m/s →
          </div>
          <div className="px-2 py-1 rounded" style={{background:'rgba(0,0,0,0.7)', border:'1px solid #ff6600', color: vy >= 0 ? '#00ff41' : '#ff3131'}}>
            Vy = {vy.toFixed(1)} m/s {vy >= 0 ? '↑' : '↓'}
          </div>
        </div>
      );
    }

    function ControlPanel({ vi, setVi, angle, setAngle, onSimulate, onRandomize, onNewDrive, isAnimating, driveOver }) {
      const btnBase = { fontFamily:'inherit', cursor:'pointer' };
      if (driveOver) {
        return (
          <div className="p-4 rounded-lg text-center" style={{background:'#1a1a2e', border:'2px solid #2a2a4a'}}>
            <button onClick={onNewDrive} className="font-pixel text-sm py-3 px-8 rounded"
              style={{...btnBase, background:'#001133', color:'#00aaff', border:'2px solid #00aaff', textShadow:'0 0 8px #00aaff'}}>
              [ NEW DRIVE ]
            </button>
          </div>
        );
      }
      return (
        <div className="grid grid-cols-2 gap-4 p-4 rounded-lg" style={{background:'#1a1a2e', border:'2px solid #2a2a4a'}}>
          <div>
            <label className="font-pixel text-xs mb-2 block" style={{color:'#00aaff'}}>VELOCITY (v_i)</label>
            <div className="flex items-center gap-2">
              <input type="range" min="1" max="50" value={vi}
                onChange={e => setVi(Number(e.target.value))} className="flex-1" disabled={isAnimating} />
              <span className="font-pixel text-xs w-16 text-right" style={{color:'#00ff41'}}>{vi} m/s</span>
            </div>
          </div>
          <div>
            <label className="font-pixel text-xs mb-2 block" style={{color:'#ff6600'}}>ANGLE (θ)</label>
            <div className="flex items-center gap-2">
              <input type="range" min="1" max="89" value={angle}
                onChange={e => setAngle(Number(e.target.value))} className="flex-1" disabled={isAnimating} />
              <span className="font-pixel text-xs w-16 text-right" style={{color:'#00ff41'}}>{angle}°</span>
            </div>
          </div>
          <button onClick={onSimulate} disabled={isAnimating} className="font-pixel text-xs py-3 px-4 rounded"
            style={{...btnBase, background: isAnimating ? '#1a1a2e' : '#003311', color: isAnimating ? '#2a4a2a' : '#00ff41',
              border:`2px solid ${isAnimating ? '#1a3a1a' : '#00ff41'}`, cursor: isAnimating ? 'not-allowed' : 'pointer',
              textShadow: isAnimating ? 'none' : '0 0 8px #00ff41'}}>
            {isAnimating ? '[ SIMULATING... ]' : '[ SIMULATE ]'}
          </button>
          <button onClick={onRandomize} disabled={isAnimating} className="font-pixel text-xs py-3 px-4 rounded"
            style={{...btnBase, background:'#130d2e', color: isAnimating ? '#2a2a4a' : '#ffe600',
              border:`2px solid ${isAnimating ? '#2a2a4a' : '#ffe600'}`, cursor: isAnimating ? 'not-allowed' : 'pointer',
              textShadow: isAnimating ? 'none' : '0 0 8px #ffe600'}}>
            [ SET WR ]
          </button>
        </div>
      );
    }

    function DataTable({ log }) {
      return (
        <div className="rounded-lg overflow-hidden" style={{border:'2px solid #2a2a4a'}}>
          <div className="px-3 py-2" style={{background:'#0a0a1a'}}>
            <span className="font-pixel text-xs" style={{color:'#4a4a7a'}}>PLAY LOG (LAST 5)</span>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full font-pixel" style={{borderCollapse:'collapse', fontSize:'9px'}}>
              <thead>
                <tr style={{background:'#151530'}}>
                  {['DOWN', 'v_i', 'θ', 'DIST', 'GAINED', 'RESULT'].map(h => (
                    <th key={h} className="px-2 py-2 text-left" style={{color:'#4a4a7a', borderBottom:'1px solid #2a2a4a'}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {log.length === 0
                  ? <tr><td colSpan={6} className="px-3 py-4 text-center" style={{color:'#2a2a4a'}}>NO PLAYS YET</td></tr>
                  : log.map(r => (
                    <tr key={r.id} style={{borderBottom:'1px solid #1a1a2e'}}>
                      <td className="px-2 py-2" style={{color: r.down === 4 ? '#ff3131' : '#4a4a7a'}}>{downLabel(r.down)}</td>
                      <td className="px-2 py-2" style={{color:'#00aaff'}}>{r.vi}</td>
                      <td className="px-2 py-2" style={{color:'#ff6600'}}>{r.angle}°</td>
                      <td className="px-2 py-2" style={{color:'#f0f0e8'}}>{r.dist}m</td>
                      <td className="px-2 py-2" style={{color:'#ffe600'}}>{r.gained !== null ? `+${r.gained}yd` : '—'}</td>
                      <td className="px-2 py-2 font-bold" style={{color: r.result === 'COMPLETE' ? '#00ff41' : r.result === 'TD' ? '#00aaff' : '#ff3131'}}>
                        {r.result}
                      </td>
                    </tr>
                  ))
                }
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ── App ─────────────────────────────────────────────────────────────────────

    function App() {
      const [vi, setVi] = useState(25);
      const [angle, setAngle] = useState(45);
      const [receiverDist, setReceiverDist] = useState(20);

      // Football state
      const [down, setDown] = useState(1);
      const [yardsToGo, setYardsToGo] = useState(10);
      const [fieldPos, setFieldPos] = useState(20);   // own yard line 0–100
      const [touchdowns, setTouchdowns] = useState(0);
      const [driveOver, setDriveOver] = useState(false); // true after TD or turnover

      const [isAnimating, setIsAnimating] = useState(false);
      const [currentVx, setCurrentVx] = useState(0);
      const [currentVy, setCurrentVy] = useState(0);
      const [playLog, setPlayLog] = useState([]);

      const canvasRef = useRef(null);
      const animRef = useRef(null);
      const trailRef = useRef([]);

      // Meters from QB to first-down line
      const firstDownMeters = yardsToMeters(yardsToGo);
      // Meters from QB to end zone
      const endZoneMeters = yardsToMeters(100 - fieldPos);
      // Max allowed receiver dist so WR doesn't go past end zone
      const maxRecvDist = Math.max(5, Math.min(54, Math.floor(endZoneMeters - 0.5)));

      const redraw = useCallback((rcvState = 'idle') => {
        const canvas = canvasRef.current; if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
        drawField(ctx, receiverDist, firstDownMeters, endZoneMeters);
        drawQB(ctx);
        drawReceiver(ctx, receiverDist, rcvState);
      }, [receiverDist, firstDownMeters, endZoneMeters]);

      useEffect(() => { if (!isAnimating) redraw(); }, [redraw, isAnimating]);

      const randomizeReceiver = useCallback((currentFieldPos, currentYardsToGo) => {
        const maxM = Math.max(5, Math.min(54, Math.floor(yardsToMeters(100 - currentFieldPos) - 0.5)));
        const minM = 5;
        const dist = Math.floor(Math.random() * (maxM - minM)) + minM;
        return dist;
      }, []);

      const handleSetWR = () => {
        if (isAnimating || driveOver) return;
        setReceiverDist(randomizeReceiver(fieldPos, yardsToGo));
      };

      const logPlay = (downVal, viVal, angleVal, distVal, gained, result) => {
        setPlayLog(prev => [{ id: Date.now(), down: downVal, vi: viVal, angle: angleVal, dist: distVal, gained, result }, ...prev].slice(0, 5));
      };

      const handleNewDrive = () => {
        const startFieldPos = 20;
        const startYTG = 10;
        setDown(1); setYardsToGo(startYTG); setFieldPos(startFieldPos); setDriveOver(false);
        const newDist = randomizeReceiver(startFieldPos, startYTG);
        setReceiverDist(newDist);
      };

      const handleSimulate = () => {
        if (isAnimating || driveOver) return;
        if (animRef.current) cancelAnimationFrame(animRef.current);
        trailRef.current = [];
        setIsAnimating(true);

        const viVal = vi, angleVal = angle, distVal = Math.min(receiverDist, maxRecvDist);
        const downVal = down, ytgVal = yardsToGo, fpVal = fieldPos;
        let startTime = null;

        const animate = (ts) => {
          if (!startTime) startTime = ts;
          const t = (ts - startTime) / 1000;
          const { x, y, vx, vy } = ballPos(t, viVal, angleVal);

          setCurrentVx(vx); setCurrentVy(vy);
          const canvas = canvasRef.current; if (!canvas) return;
          const ctx = canvas.getContext('2d');

          trailRef.current.push(worldToCanvas(x, y));
          if (trailRef.current.length > 20) trailRef.current.shift();

          ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
          drawField(ctx, distVal, firstDownMeters, endZoneMeters);
          drawQB(ctx); drawReceiver(ctx, distVal, 'idle');
          drawBall(ctx, trailRef.current, x, y);

          const caught = Math.abs(x - distVal) < 1.2 && y >= CATCH_MIN_Y && y <= CATCH_MAX_Y;

          if (caught) {
            const yardsGained = metersToYards(distVal);
            const newFP = Math.min(100, fpVal + yardsGained);
            const isTD = newFP >= 100;
            const isFirstDown = yardsGained >= ytgVal;

            ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
            drawField(ctx, distVal, firstDownMeters, endZoneMeters);
            drawQB(ctx); drawReceiver(ctx, distVal, 'caught');
            drawBall(ctx, trailRef.current, x, y);

            if (isTD) {
              drawBigText(ctx, 'TOUCHDOWN!', `+${yardsGained} YARDS`, '#ffe600', 'rgba(0,60,20,0.8)');
              logPlay(downVal, viVal, angleVal, distVal, yardsGained, 'TD');
              setTouchdowns(td => td + 1);
              setDriveOver(true);
            } else {
              if (isFirstDown) {
                drawBigText(ctx, 'COMPLETE!', `FIRST DOWN! +${yardsGained} YDS`, '#00ff41', 'rgba(0,255,65,0.1)');
                setDown(1); setYardsToGo(10);
              } else {
                drawBigText(ctx, 'COMPLETE!', `+${yardsGained} YDS`, '#00ff41', 'rgba(0,255,65,0.08)');
                setDown(d => d + 1); setYardsToGo(ytg => Math.max(1, ytg - yardsGained));
              }
              logPlay(downVal, viVal, angleVal, distVal, yardsGained, 'COMPLETE');
              setFieldPos(newFP);
              // Set new receiver after a brief delay so state updates propagate
              setTimeout(() => {
                setReceiverDist(randomizeReceiver(newFP, isFirstDown ? 10 : Math.max(1, ytgVal - yardsGained)));
              }, 800);
            }
            setIsAnimating(false);
            return;
          }

          const pastWR = x > distVal + 1.5;
          const hitGround = y < 0 && x > 0.5;

          if (pastWR || hitGround) {
            ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
            drawField(ctx, distVal, firstDownMeters, endZoneMeters);
            drawQB(ctx); drawReceiver(ctx, distVal, 'missed');
            drawBall(ctx, trailRef.current, x, Math.max(y, 0));

            const nextDown = downVal + 1;
            if (nextDown > 4) {
              drawBigText(ctx, 'TURNOVER!', 'TURNOVER ON DOWNS', '#ff3131', 'rgba(80,0,0,0.7)');
              logPlay(downVal, viVal, angleVal, distVal, null, 'INCOMPLETE');
              setDriveOver(true);
            } else {
              drawBigText(ctx, 'INCOMPLETE', `${downLabel(nextDown)} DOWN`, '#ff3131', 'rgba(255,49,49,0.08)');
              logPlay(downVal, viVal, angleVal, distVal, null, 'INCOMPLETE');
              setDown(nextDown);
            }
            setIsAnimating(false);
            return;
          }

          animRef.current = requestAnimationFrame(animate);
        };

        animRef.current = requestAnimationFrame(animate);
      };

      const a = toRad(angle);
      const previewVx = (vi * Math.cos(a)).toFixed(1);
      const previewVy = (vi * Math.sin(a)).toFixed(1);
      const previewRange = maxRange(vi, angle).toFixed(1);

      return (
        <div className="min-h-screen py-4 px-2" style={{background:'#0d0d0d', fontFamily:'"Press Start 2P", monospace'}}>
          <div className="max-w-3xl mx-auto space-y-4">

            {/* Nav */}
            <div className="flex items-center justify-between">
              <BackButton />
              <h1 className="font-pixel text-base tracking-widest" style={{color:'#00ff41', textShadow:'0 0 16px #00ff41, 2px 2px 0 #003311'}}>
                GRIDIRON DYNAMICS
              </h1>
              <div style={{width:'72px'}} /> {/* spacer */}
            </div>

            {/* Canvas */}
            <div className="relative rounded-lg overflow-hidden" style={{border:'3px solid #2a2a4a'}}>
              <canvas ref={canvasRef} width={CANVAS_W} height={CANVAS_H} className="w-full block" />
              <VelocityOverlay vx={currentVx} vy={currentVy} show={isAnimating} />
              <div className="absolute bottom-2 left-2 font-pixel pointer-events-none" style={{fontSize:'7px', color:'rgba(255,255,255,0.2)'}}>
                y = x·tan(θ) − gx²/2v²cos²(θ) &nbsp;|&nbsp; g = 9.8 m/s²
              </div>
            </div>

            {/* Downs HUD */}
            <DownsHUD down={down} yardsToGo={yardsToGo} fieldPos={fieldPos} touchdowns={touchdowns} />

            {/* Controls */}
            <ControlPanel
              vi={vi} setVi={setVi} angle={angle} setAngle={setAngle}
              onSimulate={handleSimulate} onRandomize={handleSetWR}
              onNewDrive={handleNewDrive} isAnimating={isAnimating} driveOver={driveOver}
            />

            {/* Physics preview */}
            <div className="grid grid-cols-3 gap-2 font-pixel text-center" style={{fontSize:'9px'}}>
              <div className="p-2 rounded" style={{background:'#0a0a1a', border:'1px solid #2a2a4a'}}>
                <div style={{color:'#4a4a7a'}}>Vx</div>
                <div style={{color:'#00aaff'}} className="mt-1">{previewVx} m/s</div>
              </div>
              <div className="p-2 rounded" style={{background:'#0a0a1a', border:'1px solid #2a2a4a'}}>
                <div style={{color:'#4a4a7a'}}>Vy₀</div>
                <div style={{color:'#ff6600'}} className="mt-1">{previewVy} m/s</div>
              </div>
              <div className="p-2 rounded" style={{background:'#0a0a1a', border:'1px solid #2a2a4a'}}>
                <div style={{color:'#4a4a7a'}}>MAX RANGE</div>
                <div style={{color:'#ffe600'}} className="mt-1">{previewRange} m</div>
              </div>
            </div>

            <DataTable log={playLog} />

            <div className="font-pixel text-center pb-4" style={{fontSize:'8px', color:'#2a2a4a'}}>
              CATCH ZONE ±1.2m &nbsp;|&nbsp; {CATCH_MIN_Y}m–{CATCH_MAX_Y}m HIGH &nbsp;|&nbsp; 1 METER ≈ 1.09 YARDS
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
