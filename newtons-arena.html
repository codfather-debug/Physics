<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newton's Arena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { background: #0d0d0d; margin: 0; font-family: 'Press Start 2P', monospace; }
    canvas { display: block; image-rendering: pixelated; }
    .pixel { font-family: 'Press Start 2P', monospace; }
    @keyframes goalFlash { 0%,100%{opacity:0} 20%,80%{opacity:1} }
    .goal-flash { animation: goalFlash 1.5s ease-in-out; }
    @keyframes pulse { 0%,100%{text-shadow:0 0 8px currentColor} 50%{text-shadow:0 0 24px currentColor, 0 0 40px currentColor} }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    button:active { transform: scale(0.96); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    .garage-card { transition: all 0.15s ease; cursor: pointer; }
    .garage-card:hover { transform: translateY(-2px); }
    .garage-card.selected { transform: translateY(-2px); }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

// ── Constants ────────────────────────────────────────────────────────────────
const CW = 700, CH = 480;
const ARENA = { x: 30, y: 30, w: CW - 60, h: CH - 60 };
const BALL_R = 20, CAR_R = 15;
const GOAL_H = 120;
const GOAL_Y = ARENA.y + (ARENA.h - GOAL_H) / 2;
const MAX_BALL_SPEED = 200;
const MAX_CAR_SPEED = 270;
const G = 9.8;
const THRUST = 900; // N applied per keypress frame

const PADS = [
  { id: 0, x: ARENA.x + 20,           y: ARENA.y + 20,           w: 80, h: 80, color: '#00ffff', fx:  300, fy:  200, label: '+X+Y' },
  { id: 1, x: ARENA.x + ARENA.w - 100, y: ARENA.y + 20,           w: 80, h: 80, color: '#ff00ff', fx: -300, fy:  200, label: '-X+Y' },
  { id: 2, x: ARENA.x + 20,           y: ARENA.y + ARENA.h - 100, w: 80, h: 80, color: '#ffff00', fx:  300, fy: -200, label: '+X-Y' },
  { id: 3, x: ARENA.x + ARENA.w - 100, y: ARENA.y + ARENA.h - 100, w: 80, h: 80, color: '#ff8800', fx: -300, fy: -200, label: '-X-Y' },
];

const CHASSIS_OPTIONS = [
  { id: 'heavy',  label: 'HEAVY',  mass: 100, desc: '100 kg', color: '#ff4444', hint: 'Powerful push, hard to stop' },
  { id: 'medium', label: 'MEDIUM', mass: 50,  desc: '50 kg',  color: '#ffaa00', hint: 'Balanced all-rounder' },
  { id: 'light',  label: 'LIGHT',  mass: 20,  desc: '20 kg',  color: '#44ff88', hint: 'Fast accel, weak push' },
];
const TIRE_OPTIONS = [
  { id: 'slick',    label: 'SLICK',    mu: 0.1, desc: 'μ = 0.1', color: '#00aaff', hint: 'Slides, low control' },
  { id: 'grip',     label: 'GRIP',     mu: 0.5, desc: 'μ = 0.5', color: '#aa44ff', hint: 'Good balance' },
  { id: 'offroad',  label: 'OFF-ROAD', mu: 0.9, desc: 'μ = 0.9', color: '#ff6644', hint: 'Very controlled, slower' },
];

// ── Helpers ──────────────────────────────────────────────────────────────────
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function mag(vx, vy) { return Math.sqrt(vx*vx + vy*vy); }
function norm(vx, vy) {
  const m = mag(vx, vy);
  return m < 0.001 ? [0, 0] : [vx/m, vy/m];
}

function onPad(entity, r, pad) {
  return entity.x + r > pad.x && entity.x - r < pad.x + pad.w &&
         entity.y + r > pad.y && entity.y - r < pad.y + pad.h;
}

function resolveCircles(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const dist = mag(dx, dy);
  const minDist = a.r + b.r;
  if (dist >= minDist || dist < 0.001) return;
  const overlap = minDist - dist;
  const nx = dx / dist, ny = dy / dist;
  // Separate
  const ma = a.mass, mb = b.mass;
  const total = ma + mb;
  a.x -= nx * overlap * (mb / total);
  a.y -= ny * overlap * (mb / total);
  b.x += nx * overlap * (ma / total);
  b.y += ny * overlap * (ma / total);
  // Elastic impulse
  const dvx = b.vx - a.vx, dvy = b.vy - a.vy;
  const dot = dvx * nx + dvy * ny;
  if (dot >= 0) return; // moving apart
  const impulse = (2 * dot) / (1 / ma + 1 / mb);
  a.vx += (impulse / ma) * nx;
  a.vy += (impulse / ma) * ny;
  b.vx -= (impulse / mb) * nx;
  b.vy -= (impulse / mb) * ny;
}

function resetBall(ball) {
  ball.x = ARENA.x + ARENA.w / 2;
  ball.y = ARENA.y + ARENA.h / 2;
  ball.vx = 0; ball.vy = 0;
}
function resetPlayer(player) {
  player.x = ARENA.x + ARENA.w * 0.75;
  player.y = ARENA.y + ARENA.h / 2;
  player.vx = 0; player.vy = 0;
  player.angle = Math.PI; // facing left
}
function resetAI(ai) {
  ai.x = ARENA.x + ARENA.w * 0.25;
  ai.y = ARENA.y + ARENA.h / 2;
  ai.vx = 0; ai.vy = 0;
}

// ── Drawing helpers ──────────────────────────────────────────────────────────
function drawArrow(ctx, fromX, fromY, toX, toY, color, lineW = 2, headLen = 10) {
  const dx = toX - fromX, dy = toY - fromY;
  const angle = Math.atan2(dy, dx);
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = lineW;
  ctx.beginPath(); ctx.moveTo(fromX, fromY); ctx.lineTo(toX, toY); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(toX, toY);
  ctx.lineTo(toX - headLen * Math.cos(angle - 0.4), toY - headLen * Math.sin(angle - 0.4));
  ctx.lineTo(toX - headLen * Math.cos(angle + 0.4), toY - headLen * Math.sin(angle + 0.4));
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// ── Main Component ───────────────────────────────────────────────────────────
function NewtonsArena() {
  const canvasRef = useRef(null);
  const rafRef = useRef(null);
  const lastTimeRef = useRef(null);

  // Mutable game state (refs)
  const playerRef = useRef({ x:0, y:0, vx:0, vy:0, mass:50, mu:0.5, r:CAR_R, angle:Math.PI });
  const aiRef     = useRef({ x:0, y:0, vx:0, vy:0, mass:50, mu:0.4, r:CAR_R, angle:0 });
  const ballRef   = useRef({ x:0, y:0, vx:0, vy:0, mass:1,  r:BALL_R });
  const keysRef   = useRef(new Set());
  const scoreRef  = useRef({ player: 0, ai: 0 });
  const trailRef  = useRef([]);
  const goalFlashRef = useRef({ active: false, side: null, timer: 0 });
  const hudRef    = useRef({ playerV:0, playerA:0, playerP:0, playerF:0, ballV:0, ballP:0 });

  // React state for UI overlays
  const [gameState, setGameState] = useState('garage'); // 'garage'|'playing'|'goal'|'matchover'
  const [score, setScore] = useState({ player: 0, ai: 0 });
  const [round, setRound] = useState(1);
  const [chassis, setChassis] = useState('medium');
  const [tires, setTires] = useState('grip');
  const [hoverChassis, setHoverChassis] = useState(null);
  const [hoverTires, setHoverTires] = useState(null);
  const [goalInfo, setGoalInfo] = useState(null);
  const [matchWinner, setMatchWinner] = useState(null);
  const [hudData, setHudData] = useState({ playerV:0, playerA:0, playerP:0, playerF:0, ballV:0, ballP:0 });
  const gameStateRef = useRef('garage');

  // Sync gameState to ref so loop can read it
  const setGameStateBoth = useCallback((s) => {
    gameStateRef.current = s;
    setGameState(s);
  }, []);

  // ── Key Handling ──
  useEffect(() => {
    const down = (e) => {
      const k = e.key.toLowerCase();
      const mapped = { 'arrowup':'w','arrowdown':'s','arrowleft':'a','arrowright':'d' };
      keysRef.current.add(mapped[k] || k);
      if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key)) e.preventDefault();
    };
    const up = (e) => {
      const k = e.key.toLowerCase();
      const mapped = { 'arrowup':'w','arrowdown':'s','arrowleft':'a','arrowright':'d' };
      keysRef.current.delete(mapped[k] || k);
    };
    window.addEventListener('keydown', down);
    window.addEventListener('keyup', up);
    return () => { window.removeEventListener('keydown', down); window.removeEventListener('keyup', up); };
  }, []);

  // ── Start Round ──
  const startRound = useCallback((chassisId, tiresId) => {
    const ch = CHASSIS_OPTIONS.find(c => c.id === chassisId);
    const ti = TIRE_OPTIONS.find(t => t.id === tiresId);
    const p = playerRef.current;
    p.mass = ch.mass; p.mu = ti.mu;
    resetPlayer(p);
    resetAI(aiRef.current);
    resetBall(ballRef.current);
    trailRef.current = [];
    goalFlashRef.current = { active: false, side: null, timer: 0 };
    keysRef.current.clear();
    lastTimeRef.current = null;
    setGameStateBoth('playing');
  }, [setGameStateBoth]);

  // ── Physics Update ──
  const update = useCallback((dt) => {
    const p = playerRef.current;
    const ai = aiRef.current;
    const ball = ballRef.current;
    const keys = keysRef.current;
    const gf = goalFlashRef.current;

    if (gf.active) {
      gf.timer -= dt;
      if (gf.timer <= 0) {
        gf.active = false;
        // Check match over
        const s = scoreRef.current;
        if (s.player >= 3 || s.ai >= 3) {
          setMatchWinner(s.player >= 3 ? 'PLAYER' : 'AI');
          setGameStateBoth('matchover');
          return;
        }
        resetBall(ball);
        resetPlayer(p);
        resetAI(ai);
        setGameStateBoth('garage');
      }
      return; // frozen during goal flash
    }

    // ── Player Input ──
    let pfx = 0, pfy = 0;
    if (keys.has('w')) pfy -= THRUST;
    if (keys.has('s')) pfy += THRUST;
    if (keys.has('a')) pfx -= THRUST;
    if (keys.has('d')) pfx += THRUST;

    // Update player angle based on movement intent
    if (pfx !== 0 || pfy !== 0) p.angle = Math.atan2(pfy, pfx);

    // ── AI Logic ──
    // AI starts on left side. It tries to get slightly behind the ball (from the left) to push it rightward.
    // Target: position slightly to the LEFT of the ball so it can push ball toward player's goal (right wall)
    const aiTargX = ball.x - 35;
    const aiTargY = ball.y + (ball.y - (ARENA.y + ARENA.h/2)) * 0.2;
    const aiDx = aiTargX - ai.x, aiDy = aiTargY - ai.y;
    const aiDist = mag(aiDx, aiDy);
    const aiSpd = mag(ai.vx, ai.vy);
    const [ainx, ainy] = norm(aiDx, aiDy);
    // Scale AI thrust relative to its mass (same formula as player)
    const AI_THRUST = 900;
    let aifx = ainx * AI_THRUST * Math.min(aiDist / 40, 1);
    let aify = ainy * AI_THRUST * Math.min(aiDist / 40, 1);
    if (aiDist < 5) { aifx = 0; aify = 0; }
    ai.angle = Math.atan2(aify, aifx);

    // ── Apply physics for each entity ──
    function applyPhysics(ent, fx, fy, maxSpeed) {
      const speed = mag(ent.vx, ent.vy);

      // Pad forces
      for (const pad of PADS) {
        if (onPad(ent, ent.r, pad)) {
          fx += pad.fx;
          fy += pad.fy;
        }
      }

      // Friction force (opposes motion)
      if (speed > 0.5) {
        const [nx, ny] = norm(ent.vx, ent.vy);
        const fFric = ent.mu * ent.mass * G;
        fx -= nx * fFric;
        fy -= ny * fFric;
      }

      const ax = fx / ent.mass;
      const ay = fy / ent.mass;

      ent.vx += ax * dt;
      ent.vy += ay * dt;

      // Clamp speed
      const newSpd = mag(ent.vx, ent.vy);
      if (newSpd > maxSpeed) {
        ent.vx = (ent.vx / newSpd) * maxSpeed;
        ent.vy = (ent.vy / newSpd) * maxSpeed;
      }

      ent.x += ent.vx * dt;
      ent.y += ent.vy * dt;

      return { ax, ay, fx, fy };
    }

    const { ax: pax, ay: pay, fx: pfxFinal, fy: pfyFinal } = applyPhysics(p, pfx, pfy, MAX_CAR_SPEED);
    applyPhysics(ai, aifx, aify, MAX_CAR_SPEED);
    applyPhysics(ball, 0, 0, MAX_BALL_SPEED);

    // ── Wall Bounces ──
    function wallBounce(ent, r) {
      if (ent.x - r < ARENA.x)   { ent.x = ARENA.x + r;         ent.vx = Math.abs(ent.vx) * 0.7; }
      if (ent.x + r > ARENA.x + ARENA.w) { ent.x = ARENA.x + ARENA.w - r; ent.vx = -Math.abs(ent.vx) * 0.7; }
      if (ent.y - r < ARENA.y)   { ent.y = ARENA.y + r;         ent.vy = Math.abs(ent.vy) * 0.7; }
      if (ent.y + r > ARENA.y + ARENA.h) { ent.y = ARENA.y + ARENA.h - r; ent.vy = -Math.abs(ent.vy) * 0.7; }
    }
    wallBounce(p, p.r);
    wallBounce(ai, ai.r);

    // Ball – goal openings on left/right walls
    // Left wall (AI's goal): ball passes through goal zone
    const ballInLeftGoal  = ball.y > GOAL_Y && ball.y < GOAL_Y + GOAL_H;
    const ballInRightGoal = ball.y > GOAL_Y && ball.y < GOAL_Y + GOAL_H;

    if (ball.x - ball.r < ARENA.x && ballInLeftGoal) {
      // Ball entered left goal (AI's goal) → Player scores
      scoreRef.current.player += 1;
      setScore({ ...scoreRef.current });
      setGoalInfo({ side: 'player', round: round + 1 });
      setRound(r => r + 1);
      gf.active = true; gf.side = 'player'; gf.timer = 1.5;
      setGameStateBoth('goal');
    } else if (ball.x + ball.r > ARENA.x + ARENA.w && ballInRightGoal) {
      // Ball entered right goal (Player's goal) → AI scores
      scoreRef.current.ai += 1;
      setScore({ ...scoreRef.current });
      setGoalInfo({ side: 'ai', round: round + 1 });
      setRound(r => r + 1);
      gf.active = true; gf.side = 'ai'; gf.timer = 1.5;
      setGameStateBoth('goal');
    } else {
      // Normal wall bounce for ball (only if not in goal zone)
      if (ball.x - ball.r < ARENA.x)             { ball.x = ARENA.x + ball.r;         ball.vx = Math.abs(ball.vx) * 0.75; }
      if (ball.x + ball.r > ARENA.x + ARENA.w)   { ball.x = ARENA.x + ARENA.w - ball.r; ball.vx = -Math.abs(ball.vx) * 0.75; }
      if (ball.y - ball.r < ARENA.y)             { ball.y = ARENA.y + ball.r;         ball.vy = Math.abs(ball.vy) * 0.75; }
      if (ball.y + ball.r > ARENA.y + ARENA.h)   { ball.y = ARENA.y + ARENA.h - ball.r; ball.vy = -Math.abs(ball.vy) * 0.75; }
    }

    // ── Circle Collisions ──
    resolveCircles(p, ball);
    resolveCircles(ai, ball);
    resolveCircles(p, ai);

    // ── Ball trail ──
    trailRef.current.push({ x: ball.x, y: ball.y, t: 1.0 });
    trailRef.current = trailRef.current
      .map(pt => ({ ...pt, t: pt.t - dt * 2.5 }))
      .filter(pt => pt.t > 0)
      .slice(-20);

    // ── HUD data ──
    const pSpeed = mag(p.vx, p.vy);
    const pAccel = mag(pax, pay);
    const pMom   = pSpeed * p.mass;
    const pForce = mag(pfxFinal, pfyFinal);
    const bSpeed = mag(ball.vx, ball.vy);
    const bMom   = bSpeed * ball.mass;
    hudRef.current = { playerV: pSpeed, playerA: pAccel, playerP: pMom, playerF: pForce, ballV: bSpeed, ballP: bMom };

  }, [round, setGameStateBoth]);

  // ── Canvas Render ──
  const render = useCallback(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const p = playerRef.current;
    const ai = aiRef.current;
    const ball = ballRef.current;
    const gf = goalFlashRef.current;

    // Clear
    ctx.fillStyle = '#0d0d0d';
    ctx.fillRect(0, 0, CW, CH);

    // ── Arena floor ──
    ctx.fillStyle = '#0f1f0f';
    ctx.fillRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);

    // Grid lines
    ctx.save();
    ctx.strokeStyle = '#1a3a1a';
    ctx.lineWidth = 1;
    for (let gx = ARENA.x; gx <= ARENA.x + ARENA.w; gx += 40) {
      ctx.beginPath(); ctx.moveTo(gx, ARENA.y); ctx.lineTo(gx, ARENA.y + ARENA.h); ctx.stroke();
    }
    for (let gy = ARENA.y; gy <= ARENA.y + ARENA.h; gy += 40) {
      ctx.beginPath(); ctx.moveTo(ARENA.x, gy); ctx.lineTo(ARENA.x + ARENA.w, gy); ctx.stroke();
    }
    ctx.restore();

    // Center circle
    ctx.save();
    ctx.strokeStyle = '#1a4a1a';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.arc(ARENA.x + ARENA.w/2, ARENA.y + ARENA.h/2, 60, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(ARENA.x + ARENA.w/2, ARENA.y); ctx.lineTo(ARENA.x + ARENA.w/2, ARENA.y + ARENA.h); ctx.stroke();
    ctx.restore();

    // ── Force pads ──
    for (const pad of PADS) {
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = pad.color;
      ctx.fillRect(pad.x, pad.y, pad.w, pad.h);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = pad.color;
      ctx.lineWidth = 2;
      ctx.strokeRect(pad.x, pad.y, pad.w, pad.h);
      // Arrow
      const cx = pad.x + pad.w/2, cy = pad.y + pad.h/2;
      const len = 24;
      const fn = norm(pad.fx, pad.fy);
      drawArrow(ctx, cx - fn[0]*len*0.5, cy - fn[1]*len*0.5,
                     cx + fn[0]*len*0.5, cy + fn[1]*len*0.5, pad.color, 2.5, 8);
      // Label
      ctx.fillStyle = pad.color;
      ctx.font = '5px "Press Start 2P"';
      ctx.textAlign = 'center';
      ctx.fillText(pad.label, cx, pad.y + pad.h - 5);
      ctx.restore();
    }

    // ── Goal zones ──
    // Left goal (AI's, blue)
    ctx.save();
    ctx.globalAlpha = gf.active && gf.side === 'player' ? 0.7 : 0.25;
    ctx.fillStyle = '#0044ff';
    ctx.fillRect(ARENA.x - 14, GOAL_Y, 14, GOAL_H);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#0088ff';
    ctx.lineWidth = 3;
    ctx.strokeRect(ARENA.x - 14, GOAL_Y, 14, GOAL_H);
    ctx.restore();
    // Right goal (Player's, red)
    ctx.save();
    ctx.globalAlpha = gf.active && gf.side === 'ai' ? 0.7 : 0.25;
    ctx.fillStyle = '#ff2200';
    ctx.fillRect(ARENA.x + ARENA.w, GOAL_Y, 14, GOAL_H);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#ff4444';
    ctx.lineWidth = 3;
    ctx.strokeRect(ARENA.x + ARENA.w, GOAL_Y, 14, GOAL_H);
    ctx.restore();

    // Goal labels
    ctx.save();
    ctx.font = '6px "Press Start 2P"';
    ctx.fillStyle = '#0088ff';
    ctx.textAlign = 'center';
    ctx.save(); ctx.translate(ARENA.x - 22, GOAL_Y + GOAL_H/2); ctx.rotate(-Math.PI/2); ctx.fillText('AI GOAL', 0, 0); ctx.restore();
    ctx.fillStyle = '#ff4444';
    ctx.save(); ctx.translate(ARENA.x + ARENA.w + 22, GOAL_Y + GOAL_H/2); ctx.rotate(Math.PI/2); ctx.fillText('P1 GOAL', 0, 0); ctx.restore();
    ctx.restore();

    // ── Arena border ──
    ctx.save();
    ctx.strokeStyle = '#00ff41';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#00ff41';
    ctx.shadowBlur = 8;
    ctx.strokeRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);
    ctx.restore();

    // ── Ball trail ──
    for (const pt of trailRef.current) {
      ctx.save();
      ctx.globalAlpha = pt.t * 0.3;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, BALL_R * pt.t * 0.7, 0, Math.PI*2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.restore();
    }

    // ── Ball ──
    ctx.save();
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    const ballGrad = ctx.createRadialGradient(ball.x - 5, ball.y - 5, 2, ball.x, ball.y, ball.r);
    ballGrad.addColorStop(0, '#ffffff');
    ballGrad.addColorStop(1, '#888888');
    ctx.fillStyle = ballGrad;
    ctx.fill();
    ctx.strokeStyle = '#333333';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    // Ball speed bar
    {
      const bspd = mag(ball.vx, ball.vy);
      const pct = bspd / MAX_BALL_SPEED;
      const bx = ball.x - 18, bby = ball.y - ball.r - 8;
      ctx.fillStyle = '#333'; ctx.fillRect(bx, bby, 36, 4);
      ctx.fillStyle = `hsl(${120 - pct*120},100%,60%)`;
      ctx.fillRect(bx, bby, 36 * pct, 4);
    }

    // ── Draw car helper ──
    function drawCar(ent, color, glowColor, label) {
      ctx.save();
      ctx.translate(ent.x, ent.y);
      ctx.rotate(ent.angle);
      // Glow
      ctx.shadowColor = glowColor;
      ctx.shadowBlur = 16;
      // Body
      ctx.fillStyle = color;
      ctx.fillRect(-ent.r, -ent.r * 0.75, ent.r * 2, ent.r * 1.5);
      // Windshield
      ctx.fillStyle = 'rgba(150,220,255,0.5)';
      ctx.fillRect(ent.r * 0.1, -ent.r * 0.5, ent.r * 0.65, ent.r);
      // Headlights
      ctx.fillStyle = '#ffff88';
      ctx.fillRect(ent.r * 0.8, -ent.r * 0.55, ent.r * 0.15, ent.r * 0.35);
      ctx.fillRect(ent.r * 0.8, ent.r * 0.15,  ent.r * 0.15, ent.r * 0.35);
      ctx.shadowBlur = 0;
      ctx.restore();

      // Label
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.font = '7px "Press Start 2P"';
      ctx.textAlign = 'center';
      ctx.shadowColor = glowColor; ctx.shadowBlur = 8;
      ctx.fillText(label, ent.x, ent.y - ent.r - 6);
      ctx.restore();

      // Speed bar
      const spd = mag(ent.vx, ent.vy);
      const pct = spd / MAX_CAR_SPEED;
      const bx = ent.x - 16, bby = ent.y - ent.r - 14;
      ctx.fillStyle = '#333'; ctx.fillRect(bx, bby, 32, 4);
      ctx.fillStyle = `hsl(${120 - pct*120},100%,60%)`;
      ctx.fillRect(bx, bby, 32 * pct, 4);
    }

    drawCar(ai,  '#cc2222', '#ff4444', 'AI');
    drawCar(p,   '#2244cc', '#4488ff', 'P1');

    // ── Velocity vectors ──
    if (mag(p.vx, p.vy) > 5) {
      ctx.save(); ctx.globalAlpha = 0.7;
      drawArrow(ctx, p.x, p.y, p.x + p.vx * 0.18, p.y + p.vy * 0.18, '#88aaff', 1.5, 6);
      ctx.restore();
    }
    if (mag(ball.vx, ball.vy) > 5) {
      ctx.save(); ctx.globalAlpha = 0.6;
      drawArrow(ctx, ball.x, ball.y, ball.x + ball.vx * 0.18, ball.y + ball.vy * 0.18, '#dddddd', 1.5, 6);
      ctx.restore();
    }

    // ── Goal flash overlay ──
    if (gf.active) {
      const alpha = Math.sin(gf.timer / 1.5 * Math.PI) * 0.35;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = gf.side === 'player' ? '#00aa44' : '#aa2200';
      ctx.fillRect(0, 0, CW, CH);
      ctx.restore();
      // Big text
      ctx.save();
      ctx.font = '28px "Press Start 2P"';
      ctx.textAlign = 'center';
      ctx.fillStyle = gf.side === 'player' ? '#44ff88' : '#ff4444';
      ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 30;
      ctx.fillText(gf.side === 'player' ? 'GOAL!  P1 SCORES!' : 'GOAL!  AI SCORES!', CW/2, CH/2);
      ctx.restore();
    }

    // ── Score display ──
    const s = scoreRef.current;
    ctx.save();
    ctx.font = '18px "Press Start 2P"';
    ctx.textAlign = 'center';
    // AI score (left)
    ctx.fillStyle = '#4488ff'; ctx.shadowColor = '#4488ff'; ctx.shadowBlur = 10;
    ctx.fillText(s.ai, ARENA.x + 60, ARENA.y - 8);
    // Separator
    ctx.fillStyle = '#00ff41'; ctx.shadowColor = '#00ff41';
    ctx.fillText(':', CW/2, ARENA.y - 8);
    // Player score (right)
    ctx.fillStyle = '#ff4444'; ctx.shadowColor = '#ff4444';
    ctx.fillText(s.player, ARENA.x + ARENA.w - 60, ARENA.y - 8);
    ctx.restore();

    // Score labels
    ctx.save();
    ctx.font = '7px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#4488ff'; ctx.fillText('AI', ARENA.x + 60, ARENA.y - 18);
    ctx.fillStyle = '#ff4444'; ctx.fillText('P1', ARENA.x + ARENA.w - 60, ARENA.y - 18);
    ctx.restore();

  }, []);

  // ── Game Loop ──
  useEffect(() => {
    const loop = (timestamp) => {
      if (gameStateRef.current === 'playing' || gameStateRef.current === 'goal') {
        if (lastTimeRef.current === null) lastTimeRef.current = timestamp;
        const dt = Math.min((timestamp - lastTimeRef.current) / 1000, 0.05);
        lastTimeRef.current = timestamp;
        update(dt);
        // Update HUD state periodically (every ~3 frames)
        setHudData({ ...hudRef.current });
      } else {
        lastTimeRef.current = null;
      }
      render();
      rafRef.current = requestAnimationFrame(loop);
    };
    rafRef.current = requestAnimationFrame(loop);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [update, render]);

  // ── Garage Screen ──
  const selectedChassis = CHASSIS_OPTIONS.find(c => c.id === chassis);
  const selectedTires = TIRE_OPTIONS.find(t => t.id === tires);
  const hoverC = hoverChassis ? CHASSIS_OPTIONS.find(c => c.id === hoverChassis) : selectedChassis;
  const hoverT = hoverTires ? TIRE_OPTIONS.find(t => t.id === hoverTires) : selectedTires;
  const maxAccel = (THRUST / hoverC.mass).toFixed(1);
  const fFric = (hoverT.mu * hoverC.mass * G).toFixed(1);
  const netForce = Math.max(0, THRUST - parseFloat(fFric)).toFixed(1);

  return (
    <div className="min-h-screen flex flex-col items-center py-4 px-2" style={{ background: '#0d0d0d', minWidth: 740 }}>
      {/* Header */}
      <div className="w-full flex items-center justify-between mb-3" style={{ maxWidth: 740 }}>
        <a href="index.html" className="pixel text-xs no-underline"
           style={{ color: '#00ff41', textDecoration: 'none', textShadow: '0 0 8px #00ff41' }}>
          ← MENU
        </a>
        <h1 className="pixel text-center" style={{
          color: '#00ff41', fontSize: 14,
          textShadow: '0 0 20px #00ff41, 2px 2px 0 #003311',
          letterSpacing: 2, lineHeight: 1.8
        }}>
          NEWTON'S ARENA
        </h1>
        <div className="pixel text-xs" style={{ color: '#444', minWidth: 60, textAlign: 'right' }}>
          RND {round}/3+
        </div>
      </div>

      {/* Canvas */}
      <div style={{ position: 'relative' }}>
        <canvas ref={canvasRef} width={CW} height={CH}
          style={{ border: '2px solid #1a1a1a', borderRadius: 4, background: '#0d0d0d' }} />

        {/* Garage overlay */}
        {gameState === 'garage' && (
          <div className="fade-in" style={{
            position: 'absolute', inset: 0,
            background: 'rgba(0,0,0,0.88)',
            display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
            gap: 16, padding: 24, borderRadius: 4
          }}>
            <div className="pixel" style={{ color: '#ffdd00', fontSize: 13, textShadow: '0 0 16px #ffdd00', marginBottom: 4 }}>
              ⚙ GARAGE — ROUND {round}
            </div>
            <div className="pixel" style={{ color: '#666', fontSize: 7 }}>CUSTOMIZE YOUR CAR BEFORE BATTLE</div>

            {/* Chassis */}
            <div style={{ width: '100%', maxWidth: 560 }}>
              <div className="pixel" style={{ color: '#aaa', fontSize: 8, marginBottom: 8 }}>CHASSIS (MASS)</div>
              <div style={{ display: 'flex', gap: 10 }}>
                {CHASSIS_OPTIONS.map(ch => (
                  <div key={ch.id}
                    className={`garage-card ${chassis === ch.id ? 'selected' : ''}`}
                    onClick={() => setChassis(ch.id)}
                    onMouseEnter={() => setHoverChassis(ch.id)}
                    onMouseLeave={() => setHoverChassis(null)}
                    style={{
                      flex: 1, padding: '12px 8px', borderRadius: 8, textAlign: 'center',
                      background: chassis === ch.id ? `${ch.color}22` : '#111',
                      border: `2px solid ${chassis === ch.id ? ch.color : '#333'}`,
                      boxShadow: chassis === ch.id ? `0 0 12px ${ch.color}55` : 'none',
                    }}>
                    <div className="pixel" style={{ color: ch.color, fontSize: 9, marginBottom: 6 }}>{ch.label}</div>
                    <div className="pixel" style={{ color: '#ccc', fontSize: 8, marginBottom: 4 }}>{ch.desc}</div>
                    <div className="pixel" style={{ color: '#666', fontSize: 6, lineHeight: 1.8 }}>{ch.hint}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Tires */}
            <div style={{ width: '100%', maxWidth: 560 }}>
              <div className="pixel" style={{ color: '#aaa', fontSize: 8, marginBottom: 8 }}>TIRES (FRICTION μ)</div>
              <div style={{ display: 'flex', gap: 10 }}>
                {TIRE_OPTIONS.map(ti => (
                  <div key={ti.id}
                    className={`garage-card ${tires === ti.id ? 'selected' : ''}`}
                    onClick={() => setTires(ti.id)}
                    onMouseEnter={() => setHoverTires(ti.id)}
                    onMouseLeave={() => setHoverTires(null)}
                    style={{
                      flex: 1, padding: '12px 8px', borderRadius: 8, textAlign: 'center',
                      background: tires === ti.id ? `${ti.color}22` : '#111',
                      border: `2px solid ${tires === ti.id ? ti.color : '#333'}`,
                      boxShadow: tires === ti.id ? `0 0 12px ${ti.color}55` : 'none',
                    }}>
                    <div className="pixel" style={{ color: ti.color, fontSize: 9, marginBottom: 6 }}>{ti.label}</div>
                    <div className="pixel" style={{ color: '#ccc', fontSize: 8, marginBottom: 4 }}>{ti.desc}</div>
                    <div className="pixel" style={{ color: '#666', fontSize: 6, lineHeight: 1.8 }}>{ti.hint}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Live physics preview */}
            <div style={{
              width: '100%', maxWidth: 560, padding: '12px 16px',
              background: '#0a1a0a', border: '1px solid #1a4a1a', borderRadius: 6
            }}>
              <div className="pixel" style={{ color: '#00ff41', fontSize: 7, marginBottom: 8 }}>LIVE PHYSICS PREVIEW</div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8 }}>
                {[
                  { label: 'MASS', val: `${hoverC.mass} kg`, color: hoverC.color },
                  { label: 'FRICTION μ', val: hoverT.mu.toFixed(1), color: hoverT.color },
                  { label: 'MAX ACCEL', val: `${maxAccel} m/s²`, color: '#ffdd00', sub: 'a = F/m' },
                  { label: 'THRUST F', val: `${THRUST} N`, color: '#aaa' },
                  { label: 'FRICTION F', val: `${fFric} N`, color: '#ff8888', sub: 'f = μmg' },
                  { label: 'NET FORCE', val: `${netForce} N`, color: '#44ff88', sub: 'F-f' },
                ].map(item => (
                  <div key={item.label} className="pixel" style={{
                    textAlign: 'center', padding: '6px 4px',
                    background: '#050f05', borderRadius: 4, border: '1px solid #1a2a1a'
                  }}>
                    <div style={{ color: '#555', fontSize: 5, marginBottom: 4 }}>{item.label}</div>
                    <div style={{ color: item.color, fontSize: 9 }}>{item.val}</div>
                    {item.sub && <div style={{ color: '#333', fontSize: 5, marginTop: 3 }}>{item.sub}</div>}
                  </div>
                ))}
              </div>
            </div>

            <button
              onClick={() => startRound(chassis, tires)}
              className="pixel"
              style={{
                background: '#00ff41', color: '#000', border: 'none', borderRadius: 6,
                padding: '12px 40px', fontSize: 12, cursor: 'pointer',
                boxShadow: '0 0 24px #00ff4188', letterSpacing: 2
              }}>
              START ROUND {round}
            </button>

            <div className="pixel" style={{ color: '#444', fontSize: 6, textAlign: 'center', lineHeight: 2 }}>
              WASD / ARROW KEYS TO DRIVE · PUSH BALL INTO AI'S GOAL (LEFT)
            </div>
          </div>
        )}

        {/* Match Over overlay */}
        {gameState === 'matchover' && (
          <div className="fade-in" style={{
            position: 'absolute', inset: 0,
            background: 'rgba(0,0,0,0.92)',
            display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
            gap: 20, borderRadius: 4
          }}>
            <div className="pixel pulse" style={{
              fontSize: 22, lineHeight: 2,
              color: matchWinner === 'PLAYER' ? '#44ff88' : '#ff4444',
              textShadow: `0 0 30px ${matchWinner === 'PLAYER' ? '#44ff88' : '#ff4444'}`
            }}>
              {matchWinner === 'PLAYER' ? 'YOU WIN!' : 'AI WINS!'}
            </div>
            <div className="pixel" style={{ color: '#aaa', fontSize: 9 }}>
              FINAL SCORE: AI {scoreRef.current.ai} — {scoreRef.current.player} P1
            </div>
            <div className="pixel" style={{ color: '#666', fontSize: 7, textAlign: 'center', lineHeight: 2 }}>
              {matchWinner === 'PLAYER'
                ? 'F = ma MASTERED!'
                : 'THE LAWS OF NEWTON PREVAIL!'}
            </div>
            <button
              onClick={() => {
                scoreRef.current = { player: 0, ai: 0 };
                setScore({ player: 0, ai: 0 });
                setRound(1);
                setMatchWinner(null);
                trailRef.current = [];
                goalFlashRef.current = { active: false, side: null, timer: 0 };
                setGameStateBoth('garage');
              }}
              className="pixel"
              style={{
                background: '#222', color: '#00ff41', border: '2px solid #00ff41',
                borderRadius: 6, padding: '10px 28px', fontSize: 10, cursor: 'pointer',
                boxShadow: '0 0 16px #00ff4144'
              }}>
              PLAY AGAIN
            </button>
          </div>
        )}
      </div>

      {/* HUD Panel */}
      <div style={{
        width: CW, marginTop: 8,
        background: '#080f08', border: '1px solid #1a3a1a', borderRadius: 6,
        padding: '10px 16px', display: 'flex', flexDirection: 'column', gap: 8
      }}>
        <div style={{ display: 'flex', gap: 8, alignItems: 'flex-start' }}>
          {/* Player HUD */}
          <div style={{ flex: 1 }}>
            <div className="pixel" style={{ color: '#4488ff', fontSize: 7, marginBottom: 6,
              textShadow: '0 0 8px #4488ff' }}>P1 TELEMETRY</div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 4 }}>
              {[
                { label: '|v| SPEED', val: hudData.playerV.toFixed(1) + ' px/s', color: '#88aaff' },
                { label: 'ACCEL a', val: hudData.playerA.toFixed(1) + ' px/s²', color: '#aaccff' },
                { label: 'MOMENTUM p', val: hudData.playerP.toFixed(0) + ' kg·px/s', color: '#6699ff', sub: 'p = mv' },
                { label: 'NET FORCE', val: hudData.playerF.toFixed(0) + ' N', color: '#4488ff', sub: 'F = ma' },
              ].map(item => (
                <div key={item.label} className="pixel" style={{
                  padding: '4px 6px', background: '#0a150a', borderRadius: 4,
                  border: '1px solid #1a2a1a'
                }}>
                  <div style={{ color: '#444', fontSize: 5 }}>{item.label} {item.sub && <span style={{color:'#2a3a2a'}}>({item.sub})</span>}</div>
                  <div style={{ color: item.color, fontSize: 8, marginTop: 2 }}>{item.val}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Ball HUD */}
          <div style={{ flex: 0.6 }}>
            <div className="pixel" style={{ color: '#dddddd', fontSize: 7, marginBottom: 6 }}>BALL</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
              {[
                { label: '|v| SPEED', val: hudData.ballV.toFixed(1) + ' px/s', color: '#ddd' },
                { label: 'MOMENTUM p', val: hudData.ballP.toFixed(2) + ' kg·px/s', color: '#bbb', sub: 'p=mv' },
              ].map(item => (
                <div key={item.label} className="pixel" style={{
                  padding: '4px 6px', background: '#0a150a', borderRadius: 4,
                  border: '1px solid #1a2a1a'
                }}>
                  <div style={{ color: '#444', fontSize: 5 }}>{item.label} {item.sub && <span style={{color:'#2a3a2a'}}>({item.sub})</span>}</div>
                  <div style={{ color: item.color, fontSize: 8, marginTop: 2 }}>{item.val}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Physics equations */}
          <div style={{ flex: 0.9 }}>
            <div className="pixel" style={{ color: '#ffdd00', fontSize: 7, marginBottom: 6,
              textShadow: '0 0 8px #ffdd0088' }}>PHYSICS LAWS</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
              {[
                { eq: 'F = m · a', desc: "Newton's 2nd Law" },
                { eq: 'p = m · v', desc: 'Momentum' },
                { eq: 'f = μ · N', desc: 'Friction Force' },
                { eq: 'J = F · Δt', desc: 'Impulse' },
                { eq: 'Δp = J', desc: 'Impulse-Momentum' },
              ].map(item => (
                <div key={item.eq} className="pixel" style={{
                  padding: '3px 6px', background: '#0a0f00', borderRadius: 4,
                  border: '1px solid #2a2a0a',
                  display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8
                }}>
                  <span style={{ color: '#ffdd44', fontSize: 8 }}>{item.eq}</span>
                  <span style={{ color: '#555', fontSize: 5, textAlign: 'right' }}>{item.desc}</span>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* Pad legend */}
        <div style={{ borderTop: '1px solid #1a2a1a', paddingTop: 8, display: 'flex', gap: 12, flexWrap: 'wrap', alignItems: 'center' }}>
          <div className="pixel" style={{ color: '#555', fontSize: 6 }}>FORCE PADS:</div>
          {PADS.map(pad => (
            <div key={pad.id} className="pixel" style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 6 }}>
              <div style={{ width: 10, height: 10, background: pad.color, borderRadius: 2, opacity: 0.8 }} />
              <span style={{ color: pad.color }}>({pad.fx > 0 ? '+' : ''}{pad.fx}, {pad.fy > 0 ? '+' : ''}{pad.fy}) N</span>
            </div>
          ))}
          <div className="pixel" style={{ color: '#444', fontSize: 6, marginLeft: 'auto' }}>
            Drive over pads to get force boosts!
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<NewtonsArena />);
</script>
</body>
</html>
